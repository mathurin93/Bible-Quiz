  <style>
    :root {
      --forest: #214c3b;
      --ink: #243d32;
      --muted: #67756e;
      --cream: #f7f7f2;
      --line: #e1e6dc;
      --lime: #d9ed9e;
      --white: #fff;
      --radius: 20px
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--cream);
      font-size: 16px;
      line-height: 1.6
    }

    button,
    a,
    input,
    select {
      touch-action: manipulation
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent
    }

    button {
      cursor: pointer
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid #b78a31;
      outline-offset: 4px
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    h1,
    h2,
    h3 {
      line-height: 1.2
    }

    h1 {
      font-size: 36px;
      font-weight: 750;
      letter-spacing: -1.2px
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.5px
    }

    h3 {
      font-size: 18px;
      font-weight: 700
    }

    svg.icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .skip-link {
      position: fixed;
      top: -70px;
      left: 20px;
      z-index: 100;
      background: white;
      padding: 12px 18px;
      border: 2px solid var(--forest);
      border-radius: 9px
    }

    .skip-link:focus {
      top: 12px
    }

    .sidebar {
      width: 238px;
      position: fixed;
      inset: 0 auto 0 0;
      background: var(--forest);
      color: #e7eee4;
      padding: 34px 22px 20px;
      display: flex;
      flex-direction: column;
      z-index: 20
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 25px;
      font-weight: 700;
      line-height: 1
    }

    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 46px;
      background: var(--lime);
      border-radius: 12px;
      color: var(--forest);
      transform: rotate(-5deg)
    }

    .brand-icon .icon {
      width: 26px;
      height: 26px
    }

    .brand-small {
      display: block;
      font-size: 11px;
      letter-spacing: 4px;
      color: #d1e3a6;
      margin-top: 7px
    }

    .side-label {
      font-size: 10px;
      letter-spacing: 1.6px;
      color: #a8bcae;
      margin: 50px 13px 15px
    }

    .nav-link {
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 13px 14px;
      border-radius: 11px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #d6e2d9;
      transition: background .15s
    }

    .nav-link:hover {
      background: #315c48
    }

    .nav-link.active {
      background: #d9ed9e;
      color: #264735
    }

    .nav-link .icon {
      width: 20px;
      height: 20px
    }

    .nav-link .nav-count {
      margin-left: auto;
      background: #bcd483;
      min-width: 21px;
      text-align: center;
      border-radius: 6px;
      font-size: 10px;
      line-height: 22px
    }

    .side-bottom {
      margin-top: auto;
      padding-top: 45px
    }

    .side-note {
      padding: 18px 16px 19px;
      background: #2a5542;
      border: 1px solid #416751;
      border-radius: 15px
    }

    .side-note .icon {
      color: #cee69b;
      width: 27px;
      height: 27px;
      margin-bottom: 12px
    }

    .side-note h3 {
      font-size: 15px;
      color: #eff6e5;
      margin-bottom: 7px
    }

    .side-note p {
      font-size: 12px;
      color: #c7d7c8;
      line-height: 1.7
    }

    .side-help {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      padding: 18px 8px 12px;
      color: #e7eee4
    }

    .side-scope {
      font-size: 10px;
      color: #a8bcae;
      padding: 0 8px
    }

    .app-shell {
      margin-left: 238px;
      min-height: 100vh
    }

    .topbar {
      min-height: 78px;
      padding: 0 44px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fcfcf9
    }

    .desktop-breadcrumb {
      font-size: 10px;
      letter-spacing: 1.2px;
      color: #7b857c
    }

    .desktop-breadcrumb strong {
      color: #3f5046;
      font-size: 12px;
      letter-spacing: 0;
      font-weight: 500
    }

    .crumb-divider {
      padding: 0 15px;
      color: #bdc7ba
    }

    .version-pill {
      font-size: 11px;
      padding: 6px 10px;
      border: 1px solid #dfe5db;
      background: white;
      border-radius: 20px;
      white-space: nowrap
    }

    .version-pill>span {
      display: inline-block;
      background: #71a55b;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: white;
      color: var(--forest)
    }

    #main {
      max-width: 1390px;
      margin: auto;
      padding: 36px 44px 38px;
      outline: none
    }

    .mobile-brand,
    .mobile-nav {
      display: none
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.65px;
      text-transform: uppercase;
      color: #607363
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 13px
    }

    .page-intro {
      margin-bottom: 26px
    }

    .page-intro p {
      margin-top: 10px;
      color: var(--muted);
      max-width: 620px
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 21px
    }

    .link-btn {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--forest)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 10px 19px;
      border: 1px solid var(--forest);
      border-radius: 10px;
      background: var(--forest);
      color: white;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 700;
      transition: transform .15s, background .15s
    }

    .btn:hover {
      background: #32644d;
      transform: translateY(-1px)
    }

    .btn.secondary {
      background: white;
      color: var(--forest);
      border-color: var(--line)
    }

    .btn.secondary:hover {
      background: #f0f4e9
    }

    .btn.lime {
      background: var(--lime);
      border-color: var(--lime);
      color: var(--forest)
    }

    .btn.lime:hover {
      background: #c9e18c
    }

    .btn.small-btn {
      padding: 7px 13px;
      min-height: 37px;
      font-size: 12px
    }

    .btn.danger {
      background: #9b413c;
      border-color: #9b413c
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 12px;
      align-items: center;
      overflow: hidden;
      border: 1px solid #dce7cd;
      border-radius: var(--radius);
      padding: 32px 35px;
      background: #eaf0de;
      margin-bottom: 25px
    }

    .hero h1 {
      font-size: 43px;
      line-height: 1.12;
      letter-spacing: -1.8px;
      max-width: 500px;
      margin: 12px 0 15px
    }

    .hero h1 em {
      font-style: normal;
      color: #537843
    }

    .hero p {
      color: #52654d;
      max-width: 405px;
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 22px
    }

    .hero-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 215px;
      isolation: isolate
    }

    .hero-visual::before {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      border: 1px solid #ccdbbc;
      border-radius: 50%;
      z-index: -1
    }

    .hero-visual::after {
      content: '';
      position: absolute;
      width: 270px;
      height: 270px;
      border: 1px dashed #cbd9bd;
      border-radius: 50%;
      z-index: -1
    }

    .book-illustration {
      width: 170px;
      height: 135px;
      position: relative;
      transform: rotate(-10deg);
      filter: drop-shadow(4px 12px 8px #abc09455)
    }

    .book-left,
    .book-right {
      position: absolute;
      top: 20px;
      width: 83px;
      height: 111px;
      background: #fffdf3;
      border: 2px solid #537450;
      box-shadow: 0 7px 0 #9fb37a, 0 10px 0 #365c3c
    }

    .book-left {
      left: 2px;
      border-radius: 12px 3px 1px 8px;
      transform: skewY(-10deg)
    }

    .book-right {
      right: 2px;
      border-radius: 3px 12px 8px 1px;
      transform: skewY(10deg)
    }

    .book-line {
      height: 2px;
      background: #ccd7b9;
      margin: 12px 14px
    }

    .book-line:first-child {
      margin-top: 26px
    }

    .book-line:last-child {
      width: 35px
    }

    .book-ribbon {
      position: absolute;
      top: 19px;
      left: 111px;
      width: 13px;
      height: 51px;
      background: #df966c;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 83%, 0 100%)
    }

    .float-badge {
      position: absolute;
      background: white;
      border: 1px solid #d5dfcb;
      border-radius: 11px;
      box-shadow: 0 5px 10px #4860380a;
      font-size: 11px;
      font-weight: 700;
      padding: 9px 12px;
      display: flex;
      gap: 7px;
      align-items: center
    }

    .float-badge.top {
      right: 2px;
      top: 15px;
      transform: rotate(7deg)
    }

    .float-badge.bottom {
      left: -5px;
      bottom: 7px;
      transform: rotate(-5deg)
    }

    .float-badge .icon {
      width: 17px;
      height: 17px;
      color: #749451
    }

    .spark {
      position: absolute;
      color: #749451;
      font-size: 23px
    }

    .spark.one {
      top: 0;
      left: 45px
    }

    .spark.two {
      bottom: 25px;
      right: 22px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 35px
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 17px 19px;
      display: flex;
      align-items: center;

  <script>const CHAPTERS = [
      {
        id: 5, title: 'A heart that follows Jesus', short: 'Life in God’s kingdom', icon: 'sun', color: 'sage', tag: 'THE SERMON ON THE MOUNT', summary: 'Jesus begins teaching on a mountainside. He describes the people God blesses and calls his followers to live with mercy, honesty, and love. He cares about our thoughts and motives as well as our actions.', sections: [
          ['5:1–12', 'The Beatitudes', 'Jesus describes God’s blessings for people who depend on him, show mercy, make peace, and remain faithful through trouble. Match each group with its promised blessing.'],

      {

          ['6:16–18', 'Fasting', 'Jesus teaches that fasting should be directed toward God, without putting on a performance for others.'],
          ['6:19–24', 'Treasure and loyalty', 'What we treasure shapes our hearts. Jesus uses the eye as a picture of a lamp and teaches that God and money cannot both be our master.'],

      {

          ['7:1–6', 'Look at your own heart', 'Jesus warns against hypocritical judgment. Deal with your own faults before trying to correct someone else, and use care with what is precious.'],
          ['7:7–12', 'Ask, seek, and knock', 'God is a good Father. Jesus also teaches us to treat people the way we would want them to treat us.'],

          ['7:15–23', 'Words and actions', 'False prophets can appear harmless. The fruit of their lives reveals them. True discipleship includes doing the Father’s will.'],

      {

          ['8:1–4', 'A man with leprosy', 'Jesus touches and heals the man. He tells him to show himself to a priest and make the offering commanded by Moses.'],
          ['8:5–13', 'The centurion’s servant', 'In Capernaum, a centurion trusts that Jesus can heal his paralyzed servant just by giving the command. Jesus praises his faith.'],
          ['8:14–17', 'Healing in Peter’s home', 'Jesus heals Peter’s mother-in-law of a fever and heals others. Matthew connects this with words from the prophet Isaiah.'],
          ['8:18–22', 'The cost of following', 'Jesus explains that following him may mean giving up comfort and putting his call first.'],
          ['8:23–27', 'The storm', 'Jesus is sleeping when the storm arrives. His frightened disciples wake him. He rebukes the wind and waves, and the lake becomes calm.'],

      },
      {

    addQ(5, 'Where did Jesus sit to begin teaching in Matthew 5?', 'On a mountainside', ['In a fishing boat', 'Inside a synagogue', 'At a tax booth'], '5:1–2', 'Jesus went up a mountainside and sat down; his disciples came to him.');
    addQ(5, 'What blessing is promised to the meek?', 'They will inherit the earth', ['They will become famous', 'They will never face trouble', 'They will rule every city'], '5:5', 'The Beatitude connects meekness with inheriting the earth.');
    addQ(5, 'What will peacemakers be called?', 'Sons of God', ['Teachers of the law', 'Rulers of Israel', 'Keepers of the temple'], '5:9', 'Jesus connects making peace with being called sons of God.');
    addQ(5, 'Which two pictures does Jesus use for his followers?', 'Salt and light', ['Bread and water', 'Seed and soil', 'Gold and silver'], '5:13–14', 'Jesus uses the pictures of salt and light to describe their influence.');
    addQ(5, 'Who should receive glory when people see the disciples’ good actions?', 'Their Father in heaven', ['The disciples themselves', 'The local rulers', 'The people watching'], '5:16', 'The purpose of their good actions is to direct honour toward God.');
    addQ(5, 'What did Jesus come to do with the Law and the Prophets?', 'Fulfil them', ['Erase them', 'Hide them', 'Sell them'], '5:17', 'Jesus explains that he came to fulfil them.');

    addQ(5, 'What simple answers does Jesus teach people to mean honestly?', 'Yes and no', ['Maybe and perhaps', 'Soon and later', 'Always and never'], '5:37', 'Jesus calls for straightforward, truthful speech.');

    addQ(5, 'How does Jesus teach his followers to respond to enemies and persecutors?', 'Love them and pray for them', ['Avoid every conversation', 'Embarrass them in public', 'Return the same treatment'], '5:43–44', 'Jesus extends love beyond friends: his teaching includes blessing, doing good, and praying for those who mistreat his followers.');

    addQ(6, 'What wrong motive does Jesus warn against when doing good?', 'Trying to impress people', ['Wanting to help others', 'Caring for a neighbour', 'Being generous in secret'], '6:1–2', 'Good actions should not become a performance to win people’s praise.');
    addQ(6, 'Who sees generosity that is done in secret?', 'The heavenly Father', ['Only the temple leaders', 'Only the giver’s friends', 'No one at all'], '6:3–4', 'The Father sees acts of kindness even when other people do not.');
    addQ(6, 'What private place does Jesus suggest for prayer?', 'A room with the door shut', ['A crowded street corner', 'The busiest marketplace', 'The highest city gate'], '6:6', 'Jesus uses a private room to illustrate prayer directed to the Father.');
    addQ(6, 'When does the Father know what people need?', 'Before they ask', ['Only after a long prayer', 'Only after others tell him', 'After a gift is offered'], '6:8', 'The Father’s knowledge of our needs does not depend on many words.');
    addQ(6, 'What daily food does Jesus include in the model prayer?', 'Bread', ['Fish', 'Grapes', 'Honey'], '6:11', 'The request for daily bread expresses dependence on God for everyday needs.');
    addQ(6, 'What does Jesus teach us to do when other people sin against us?', 'Forgive them', ['Keep a permanent list', 'Tell everyone about it', 'Make them feel worthless'], '6:14–15', 'Jesus connects forgiveness toward others with the Father’s forgiveness.');
    addQ(6, 'Where does Jesus tell his followers to store their treasure?', 'In heaven', ['Under the house', 'Inside a locked barn', 'At the city gate'], '6:19–21', 'Earthly possessions can be lost or destroyed; Jesus points to lasting treasure.');
    addQ(6, 'Which two masters does Jesus say people cannot both serve?', 'God and mammon', ['Work and rest', 'Family and friends', 'Learning and helping'], '6:24', 'Mammon means riches. Jesus describes a conflict of loyalty between God and wealth.');
    addQ(6, 'Which living things illustrate God’s care in the teaching about worry?', 'Birds and flowers', ['Fish and fig trees', 'Sheep and vines', 'Ants and cedar trees'], '6:26–30', 'Birds receiving food and flowers being clothed point to the Father’s care.');
    addQ(6, 'What should Jesus’ followers seek first?', 'God’s kingdom and righteousness', ['Comfort and popularity', 'Riches and expensive clothes', 'Praise and important titles'], '6:33', 'Jesus puts God’s kingdom and righteousness ahead of anxious pursuit of needs.');

    addQ(7, 'In the picture about judging, what should you remove first?', 'The plank in your own eye', ['The speck in another’s eye', 'The dust on your shoes', 'The branch from a tree'], '7:3–5', 'Jesus teaches people to address their own faults before correcting others.');
    addQ(7, 'Which three actions describe approaching God in Matthew 7?', 'Ask, seek, and knock', ['Buy, sell, and trade', 'Run, hide, and wait', 'Build, plant, and harvest'], '7:7–8', 'Jesus uses asking, seeking, and knocking as pictures of turning to God.');
    addQ(7, 'How should we treat other people, according to Matthew 7:12?', 'As we would want to be treated', ['Only as they treat us first', 'According to their popularity', 'Better only if they reward us'], '7:12', 'This teaching asks us to consider the care we would hope to receive.');
    addQ(7, 'Which gate leads toward life?', 'The narrow gate', ['The widest gate', 'The decorated gate', 'The oldest gate'], '7:13–14', 'Jesus contrasts the narrow way to life with the broad way to destruction.');

    addQ(7, 'What does Jesus say will help people recognise false prophets?', 'Their fruit', ['Their height', 'Their hometown', 'Their clothing colour'], '7:16–20', 'The fruit of their lives reveals their character.');
    addQ(7, 'What does Jesus say matters beyond calling him Lord?', 'Doing his Father’s will', ['Speaking the loudest', 'Owning many possessions', 'Being well known'], '7:21', 'Words alone do not replace obedience to the Father.');

    addQ(7, 'What foundation does the foolish builder choose?', 'Sand', ['Rock', 'A stone wall', 'A mountain ledge'], '7:26–27', 'The unstable foundation pictures hearing without putting Jesus’ words into practice.');

    addQ(9, 'What job was Matthew doing when Jesus called him?', 'Collecting taxes', ['Catching fish', 'Tending sheep', 'Making tents'], '9:9', 'Matthew was at a tax collector’s booth when Jesus called him to follow.');

    addQ(10, 'Which of these is a pair of brothers named in the list of apostles?', 'James and John', ['Philip and Thomas', 'Matthew and Bartholomew', 'Thaddaeus and Judas'], '10:2', 'James son of Zebedee and John are brothers. Peter and Andrew are another pair.');
    addQ(10, 'To whom were the twelve sent on this particular mission?', 'The lost sheep of Israel', ['The rulers of Rome', 'The towns of Samaria', 'The soldiers of Egypt'], '10:5–6', 'Jesus directs this mission to Israel and tells them not to go to Gentiles or Samaritans.');
    addQ(10, 'What were the apostles to announce?', 'Heaven’s kingdom had come near', ['A new emperor had arrived', 'A new temple would open', 'The fishing season had begun'], '10:7', 'Their message announces the nearness of the kingdom of heaven.');
    addQ(10, 'What were they to shake off their feet if a home or town rejected them?', 'Dust', ['Sandals', 'Water', 'Oil'], '10:14', 'Shaking off the dust marked their departure from a place that would not welcome or hear them.');

    addQ(10, 'Who would speak through them when they were brought before authorities?', 'Their Father’s Spirit', ['The temple guards', 'The crowd around them', 'The Roman governor'], '10:19–20', 'Jesus promises help from the Father’s Spirit in their testimony.');
    addQ(10, 'What does Jesus say is numbered on their heads?', 'Every hair', ['Every thought', 'Every dream', 'Every prayer'], '10:30–31', 'This detail illustrates how completely their Father knows and values them.');
    addQ(10, 'What simple drink does Jesus mention as a kindness shown to a disciple?', 'A cup of cold water', ['A cup of warm milk', 'A cup of grape juice', 'A cup of olive oil'], '10:42', 'Even this simple act of welcome and care is noticed.');

    function planView() { return `<div class="page-intro"><div class="eyebrow mb-2">FOUR WEEKS · SIX CHAPTERS</div><h1>A clear path to quiz day.</h1><p>Start whenever you’re ready. Read a little each day, revisit yesterday’s learning, and tick off each step.</p></div><div class="routine"><div class="routine-item"><strong>3 minutes</strong><span>Read a short passage</span></div><div class="routine-item"><strong>3 minutes</strong><span>Recall without looking</span></div><div class="routine-item"><strong>2 minutes</strong><span>Check and learn</span></div><div class="routine-item"><strong>2 minutes</strong><span>Practise a memory verse</span></div></div><div class="flex justify-between small muted mb-3"><span>Your study journey</span><span>${state.plan.length} of 20 steps complete</span></div><div class="progress-track mb-6"><div class="progress-fill" style="width:${state.plan.length / 20 * 100}%"></div></div><div class="plan-grid">${PLAN.map(w => `<section class="week-card"><div class="week-heading"><div class="eyebrow">WEEK ${w.week} · ${w.subtitle.toUpperCase()}</div><h2>${w.title}</h2><span class="week-count">${w.days.filter((d, i) => state.plan.includes(w.week + '-' + i)).length} of 5 steps complete</span></div>${w.days.map((d, i) => { const id = w.week + '-' + i; return `<div class="day-row ${state.plan.includes(id) ? 'completed' : ''}"><input type="checkbox" data-plan="${id}" id="plan-${id}" ${state.plan.includes(id) ? 'checked' : ''}><div><div class="day-number">DAY ${i + 1}</div><label for="plan-${id}">${E(d[0])}</label><p>${E(d[1])}</p>${d[2] ? verseLink(d[2], 'Open NKJV reading') : w.week === 4 && i === 3 ? '<button class="link-btn mt-2" data-action="mock-setup">Open mock quiz →</button>' : '<a href="#quiz">Open practice quiz →</a>'}</div></div>`; }).join('')}</section>`).join('')}</div><section class="mt-8"><div class="title-row"><h2>Memory passage checklist</h2><span class="small muted">Suggested passages</span></div><p class="small muted">Use the exact NK ent quizzes</h3>${state.history.length ? `<div class="history-list">${state.history.slice(0, 6).map(s => `<button class="history-row w-full text-left" data-action="history" data-id="${s.id}"><div><strong>${s.mode === 'mock' ? 'Mock quiz' : s.chapter === 'all' ? 'Mixed practice' : 'Matthew ' + E(s.chapter)}</strong><span>${new Date(s.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} · ${s.total} questions</span></div><strong>${s.correct}/${s.total} ${icon('right')}</strong></button>`).join('')}</div>` : '<p class="mt-3">Your first completed quiz will appear here. No rush—start when you’re ready.</p>'}</section></div></div><div class="panel mt-6"><div class="title-row mb-2"><h3>Keep your progress</h3><span class="chip">This device only</span></div><p>Progress is saved in this browser. It does not sync between students or devices. Export a backup before changing devices.</p><div class="flex gap-3 flex-wrap mt-5"><button class="btn secondary" data-action="export-progress">${icon('download')} Export progress</button><button class="btn secondary" data-action="import-progress">Import progress</button><button class="small muted" data-action="reset-progress">Reset progress</button></div><input type="file" id="import-file" accept="application/json,.json" hidden></div>`; }

    function notes() { modal('For the teacher', `<p>A study companion for <strong>ages 10–12</strong>, using <strong>Matthew 5–10 in the NKJV</strong>. The 60 questions are original practice questions, not an official question bank.</p><h3>A simple 45-minute class</h3><ul><li><strong>5 minutes:</strong> recall last week’s people, places, and events.</li><li><strong>10 minutes:</strong> read a passage together and explain unfamiliar words.</li><li><strong>10 minutes:</strong> use flashcards in pairs; ask students to explain their answers.</li><li><strong>15 minutes:</strong> take a practice quiz and revisit missed questions in the Bible.</li><li><strong>5 minutes:</strong> practise a memory passage and set a small reading goal.</li></ul><h3>Details worth checking</h3><ul><li>Matthew 8:28 describes <strong>two</strong> demon-possessed men. Matthew 9:27 describes <strong>two</strong> blind men.</li><li>The woman in Matthew 9:20 had been ill for <strong>twelve years</strong>.</li><li>Matthew 9 does not give the ruler’s name. Keep quiz answers grounded in the assigned text.</li><li>The mission in Matthew 10:5–6 is directed to Israel. Keep the instructions in their setting.</li></ul><h3>Help students understand</h3><p>Read the whole passage, including sections not covered by the questions. Explain difficult topics about anger, faithfulness, marriage, and opposition in age-appropriate language. Explain the vivid picture in Matthew 5:29–30 as taking sin seriously, never as an instruction to hurt oneself.</p><p>Memory passages are suggestions. Follow your organiser’s official list, NKJV edition, timing, and scoring rules. The app’s mock quiz gives one point for each correct answer.</p><h3>Use it with your class</h3><p>Each browser keeps its own progress. There is no class account or shared leaderboard. A student should use the same browser, or export and import their progress when changing devices.</p><div class="flex gap-3 flex-wrap mt-4"><button class="btn secondary" data-       const b = event.target.closest('[data-action]'); if (!b || b.disabled) return; const a = b.dataset.action; if (a === 'notes') return notes(); if (a === 'about') return about(); if (a === 'close-modal') return closeModal(); if (a === 'mark-read') { state.read = toggleIn(state.read, Number(b.dataset.id)); save(); render(); toast(state.read.includes(Number(b.dataset.id)) ? 'Chapter marked as studied.' : 'Chapter marked as not yet studied.'); }
      if (a === 'quiz-mode') { setup.mode = b.dataset.mode; render(); } if (a === 'start-quiz') { beginQuiz(setup); } if (a === 'quick-quiz' || a === 'chapter-quiz' || a === 'review-quiz') { if (state.activeQuiz) { modal('You have a quiz in progress', `<p>Resume your current quiz, or discard it to start this practice set.</p><div class="flex gap-3 flex-wrap mt-5"><button class="btn secondary" data-action="resume">Resume quiz</button><button class="btn" id="replace-quiz">Start new quiz</button></div>`); document.getElementById('replace-quiz').onclick = () => { closeModal(); beginQuiz({ mode: 'practice', chapter: a === 'chapter-quiz' ? Number(b.dataset.id) : 'all', count: 10, ids: a === 'review-quiz' ? state.review : null }); }; } else beginQuiz({ mode: 'practice', chapter: a === 'chapter-quiz' ? Number(b.dataset.id) : 'all', count: 10, ids: a === 'review-quiz' ? state.review : null }); }
      if (a === 'resume') { if (document.getElementById('modal').open) closeModal(); navigate('quiz'); } if (a === 'mock-setup') { setup.mode = 'mock'; result = null; navigate('quiz'); } if (a === 'answer' && state.activeQuiz && !state.activeQuiz.submitted) { const z = state.activeQuiz; z.selected = z.items[z.index].options[Number(b.dataset.index)]; save(); render(); const selected = document.querySelector('.answer-option.selected'); selected?.focus({ preventScroll: true }); } if (a === 'submit-answer') recordAnswer(); if (a === 'skip-question') recordAnswer(true); if (a === 'next-question') nextQuestion(); if (a === 'leave-quiz') navigate('study'); if (a === 'end-quiz') { modal('Finish this quiz now?', `<p>Your score will include all questions in this quiz. Unanswered questions count as missed and can be practised again.</p><div class="flex gap-3 mt-5"><button class="btn secondary" data-action="close-modal">Keep going</button><button class="btn" data-action="confirm-end">Finish and see results</button></div>`); } if (a === 'confirm-end') { closeModal(); finishQuiz(); } if (a === 'new-quiz') { result = null; render(true); } if (a === 'retry-missed') { beginQuiz({ mode: 'practice', ids: result.answers.filter(x => !x.correct).map(x => x.id) }); } if (a === 'history') { result = state.history.find(s => String(s.id) === b.dataset.id); if (state.activeQuiz) { modal('Finish your current quiz first', `<p>Your current quiz is saved. Finish or end it before opening an older result.</p><button class="btn" data-action="resume">Resume current quiz</button>`); } else navigate('quiz'); }
      if (a === 'chapter-cards') { flash.chapter = Number(b.dataset.id); flash.filter = 'all'; resetFlash(); navigate('cards'); } if (a === 'flip-card') { flash.revealed = !flash.revealed; render(); document.querySelector('.flashcard')?.focus({ preventScroll: true }); } if (a === 'shuffle-cards') { resetFlash(); render(); toast('Cards shuffled.'); } if (a === 'previous-card') { flash.index = Math.max(0, flash.index - 1); flash.revealed = false; render(); } if (a === 'next-card') { flash.index = (flash.index + 1) % flash.deck.length; flash.revealed = false; render(); } if (a === 'all-cards') { flash.filter = 'all'; resetFlash(); render(); } if (a === 'rate-card') { const q = flash.deck[flash.index]; if (!q || !flash.revealed) return; if (b.dataset.rating === 'known') { if (!state.known.includes(q.id)) state.known.push(q.id); state.review = state.review.filter(id => id !== q.id); } else { state.known = state.known.filter(id => id !== q.id); if (!state.review.includes(q.id)) state.review.push(q.id); } save(); toast(b.dataset.rating === 'known' ? 'Card marked as learned.' : 'Saved for more practice.'); if (flash.filter !== 'all') { flash.deck = flash.deck.filter(card => flash.filter === 'review' ? state.review.includes(card.id) : !state.known.includes(card.id)); flash.index = Math.min(flash.index, Math.max(0, flash.deck.length - 1)); } else flash.index = (flash.index + 1) % flash.deck.length; flash.revealed = false; render(); }
      if (a === 'export-progress') { download(JSON.stringify({ app: 'matthew-quest', exported: new Date().toISOString(), progress: { ...state, activeQuiz: null } }, null, 2), 'matthew-quest-progress.json', 'application/json'); toast('Progress backup downloaded.'); } if (a === 'import-progress') document.getElementById('import-file').click(); if (a === 'reset-progress') { modal('Reset this device’s progress?', `<p>This clears completed chapters, learned cards, quiz results, and your study checklist on this browser. Export a backup first if you want to keep them.</p><div class="flex gap-3 mt-5"><button class="btn secondary" data-action="close-modal">Keep my progress</button><button class="btn danger" data-action="confirm-reset">Reset progress</button></div>`); } if (a === 'confirm-reset') { state = defaults(); result = null; save(); resetFlash(); closeModal(); render(); toast('Progress reset. You’re ready for a fresh start.'); }
      if (a === 'download-app') { const clone = document.documentElement.cloneNode(true); clone.querySelector('#modal').removeAttribute('open'); clone.querySelector('#modal-body').innerHTML = ''; clone.querySelector('#modal-title').textContent = ''; clone.querySelector('#toast').classList.remove('visible'); clone.querySelector('#main').innerHTML = ''; download('<!DOCTYPE html>\n' + clone.outerHTML, 'Matthew-Quest.html', 'text/html'); toast('Your complete HTML app has been downloaded.'); } if (a === 'print-guide') { closeModal(); if (!currentChapter) { navigate('study/' + state.lastChapter); setTimeout(() => { document.querySelectorAll('.passage').forEach(p => p.open = true); window.print(); }, 150); } else { document.querySelectorAll('.passage').forEach(p => p.open = true); window.print(); } }
    });
    document.addEventListener('change', event => { const el = event.target; if (el.id === 'quiz-chapter') { setup.chapter = el.value; setup.count = el.value === 'all' ? setup.count : 10; render(); } if (el.id === 'quiz-count') setup.count = Number(el.value); if (el.id === 'quiz-timed') setup.timed = el.checked; if (el.id === 'flash-chapter') { flash.chapter = el.value; resetFlash(); render(); } if (el.id === 'flash-filter') { flash.filter = el.value; resetFlash(); render(); } if (el.dataset.plan) { state.plan = toggleIn(state.plan, el.dataset.plan); save(); render(); document.getElementById(el.id)?.focus({ preventScroll: true }); } if (el.dataset.memory) { state.memory = toggleIn(state.memory, Number(el.dataset.memory)); save(); render(); } if (el.id === 'import-file') importProgress(el.files[0]); });
    document.getElementById('modal').addEventListener('click', event => { if (event.target === event.currentTarget) { const rect = event.currentTarget.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeModal(); } });
    document.querySelector('.skip-link').addEventListener('click', event => { event.preventDefault(); document.getElementById('main').focus(); });
    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon));
    window.addEventListener('hashchange', routeFromHash);
    window.addEventListener('beforeunload', save);
    setInterval(tickTimer, 1000);
    routeFromHash();
  </script>
</body>
